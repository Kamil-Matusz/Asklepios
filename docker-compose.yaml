services:
  postgres:
    image: postgres
    shm_size: '4gb'
    container_name: asklepios_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=asklepios
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data

  seq:
    image: datalust/seq:latest
    container_name: asklepios_seq
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - 8081:80
      - 5341:5341
    volumes:
      - seq-data:/data

  redis:
    image: redis:7
    container_name: asklepios_redis
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data
  
  asklepios-api:
    build:
      context: .
      dockerfile: Asklepios/Asklepios.Api/Dockerfile
    container_name: asklepios_api
    restart: unless-stopped
    ports:
      - 5102:80
    environment:
      - ASPNETCORE_ENVIRONMENT=docker
      - Seq__ServerUrl=http://seq:80
    depends_on:
      - postgres
      - seq
      - redis
  
  asklepios-web:
    build:
      context: .
      dockerfile: Asklepios.Web/Dockerfile
    container_name: asklepios_web
    restart: unless-stopped
    ports:
      - 8080:80
    depends_on:
      - asklepios-api

volumes:
  postgres-data:
    driver: local
  seq-data:
    driver: local
  redis-data:
    driver: local