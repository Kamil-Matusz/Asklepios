services:
  postgres:
    image: postgres
    shm_size: '4gb'
    container_name: asklepios_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_DB=asklepios
    ports:
      - 5432:5432
    volumes:
      - postgres:/var/lib/postgresql/data

  seq:
    image: datalust/seq
    container_name: asklepios_seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - 5341:80
    volumes:
      - seq-data:/data

  redis:
    image: redis:7
    container_name: asklepios_redis
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data

volumes:
  postgres:
    driver: local
  seq-data:
    driver: local
  redis-data:
    driver: local
