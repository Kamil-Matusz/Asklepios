apiVersion: apps/v1
kind: Deployment
metadata:
  name: asklepios-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asklepios-web
  template:
    metadata:
      labels:
        app: asklepios-web
    spec:
      containers:
        - name: asklepios-web
          image: asklepios-web:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: asklepios-web
spec:
  type: NodePort
  selector:
    app: asklepios-web
  ports:
    - port: 80
      targetPort: 80